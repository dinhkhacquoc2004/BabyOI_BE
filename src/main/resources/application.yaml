
  server:
    port: ${PORT:8085}
    tomcat:
      threads:
        max: ${TOMCAT_MAX_THREADS:200}
        min-spare: ${TOMCAT_MIN_SPARE_THREADS:25}
      accept-count: ${TOMCAT_ACCEPT_COUNT:300}
      max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}

  spring:
    application:
      name: BabyOI_BE

    task:
      execution:
        pool:
          core-size: ${APP_ASYNC_CORE_SIZE:8}
          max-size: ${APP_ASYNC_MAX_SIZE:32}
          queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:500}
        thread-name-prefix: babyoi-async-

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false
      open-in-view: false

    datasource:
      url: ${SPRING_DATASOURCE_URL}
      driver-class-name: org.postgresql.Driver
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}
      hikari:
        maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
        minimum-idle: ${DB_POOL_MIN_IDLE:5}
        connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
        validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
        idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
        max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

    liquibase:
      enabled: true
      change-log: classpath:/db/changelog/db.changelog-master.yaml

    servlet:
      multipart:
        max-file-size: ${MAX_FILE_SIZE:5MB}
        max-request-size: ${MAX_REQUEST_SIZE:6MB}

    mail:
      host: ${MAIL_HOST:smtp.gmail.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      properties:
        mail:
          debug: ${MAIL_DEBUG:false}
          smtp:
            auth: true
            connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
            timeout: ${MAIL_TIMEOUT_MS:10000}
            writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
            ssl:
              trust: ${MAIL_SSL_TRUST:smtp.gmail.com}
            starttls:
              enable: true

  app:
    jwt:
      secret: ${JWT_SECRET}
      expiration-millis: ${JWT_EXPIRATION_MILLIS:432000000}
      refresh-expiration-millis: ${JWT_REFRESH_EXPIRATION_MILLIS:2592000000}

    mail:
      from: ${MAIL_FROM}

    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_IDS}

    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}
      user-avatar-folder: ${CLOUDINARY_USER_AVATAR_FOLDER:userAvatar}
      diary-folder: ${CLOUDINARY_DIARY_FOLDER:Diary}
      diary-upload-timeout-seconds: ${CLOUDINARY_DIARY_UPLOAD_TIMEOUT_SECONDS:45}
      diary-image-max-width: ${CLOUDINARY_DIARY_IMAGE_MAX_WIDTH:1080}
      diary-image-max-height: ${CLOUDINARY_DIARY_IMAGE_MAX_HEIGHT:1080}
      diary-image-quality: ${CLOUDINARY_DIARY_IMAGE_QUALITY:0.72}
      diary-compression-min-bytes: ${CLOUDINARY_DIARY_COMPRESSION_MIN_BYTES:180000}

    admin-dashboard:
      enabled: ${ADMIN_DASHBOARD_ENABLED:true}
      port: ${ADMIN_PORT:8090}
      path: ${ADMIN_DASHBOARD_PATH:admin-dashboard}

    agentic-rag:
      base-url: ${AGENTIC_RAG_BASE_URL:http://localhost:8000}
      chat-path: ${AGENTIC_RAG_CHAT_PATH:/api/chat}
      timeout-seconds: ${AGENTIC_RAG_TIMEOUT_SECONDS:60}
