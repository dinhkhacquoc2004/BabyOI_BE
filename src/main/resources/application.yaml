server:
  port: ${PORT:8085}

spring:
  application:
    name: BabyOI_BE

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        debug: ${MAIL_DEBUG:false}
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          ssl:
            trust: smtp.gmail.com
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:432000000}
    refresh-expiration-millis: ${JWT_REFRESH_EXPIRATION_MILLIS:2592000000}

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_IDS}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    user-avatar-folder: ${CLOUDINARY_USER_AVATAR_FOLDER:userAvatar}

  admin-dashboard:
    enabled: ${ADMIN_DASHBOARD_ENABLED:true}
    port: ${ADMIN_PORT:8090}
    path: ${ADMIN_DASHBOARD_PATH:admin-dashboard}