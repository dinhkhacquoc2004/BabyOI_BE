server:
  port: ${PORT:8085}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:25}
    accept-count: ${TOMCAT_ACCEPT_COUNT:300}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}

spring:
  application:
    name: BabyOI_BE

  task:
    execution:
      pool:
        core-size: ${APP_ASYNC_CORE_SIZE:8}
        max-size: ${APP_ASYNC_MAX_SIZE:32}
        queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:500}
      thread-name-prefix: babyoi-async-

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
