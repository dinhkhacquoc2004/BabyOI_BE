services:
  postgres:
    image: postgres:16-alpine
    container_name: babyoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-babyoi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: eclipse-temurin:17-jre-jammy
    container_name: babyoi-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./app.jar:/app/app.jar:ro
      - ./application.yaml:/app/config/application.yaml:ro
    environment:
      PORT: ${PORT:-8085}
      ADMIN_DASHBOARD_ENABLED: ${ADMIN_DASHBOARD_ENABLED:-false}
      MAIL_DEBUG: ${MAIL_DEBUG:-false}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MILLIS: ${JWT_EXPIRATION_MILLIS:-432000000}
      JWT_REFRESH_EXPIRATION_MILLIS: ${JWT_REFRESH_EXPIRATION_MILLIS:-2592000000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
    ports:
      - "${PORT:-8085}:${PORT:-8085}"
    command: ["java", "-jar", "/app/app.jar"]

  admin:
    image: node:22-bookworm-slim
    container_name: babyoi-admin
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    working_dir: /app/admin-dashboard
    volumes:
      - ./admin-dashboard:/app/admin-dashboard
    environment:
      NODE_ENV: development
      ADMIN_PORT: ${ADMIN_PORT:-8090}
      ADMIN_ROOT_PATH: ${ADMIN_ROOT_PATH:-/admin}
      ADMIN_COOKIE_SECRET: ${ADMIN_COOKIE_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      SPRING_API_BASE_URL: http://app:${PORT:-8085}
    ports:
      - "${ADMIN_PORT:-8090}:${ADMIN_PORT:-8090}"
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm start"

volumes:
  postgres_data:
